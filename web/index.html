<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>启德建材 · 微信销售小系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f3f3; color: #222;
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 64px;
  }
  /* 顶部 */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: #07c160; color: #fff;
    padding: 14px 16px 12px; text-align: center;
  }
  .topbar h1 { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
  .topbar p { font-size: 11px; opacity: .85; margin-top: 2px; }
  /* 分类 */
  .cats {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px;
    background: #fff; border-bottom: 1px solid #eee; scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 auto; padding: 6px 14px; border-radius: 16px;
    background: #f2f2f2; color: #555; font-size: 13px;
  }
  .cat.on { background: #07c160; color: #fff; }
  /* 商品卡 */
  .list { padding: 10px 12px; }
  .card {
    display: flex; gap: 10px; background: #fff; border-radius: 10px;
    padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .thumb {
    width: 64px; height: 64px; border-radius: 8px; flex: 0 0 64px;
    background: #eef7f0; display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .info { flex: 1; min-width: 0; }
  .info h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
  .spec { font-size: 12px; color: #888; margin-bottom: 6px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  .price { color: #e64340; font-size: 16px; font-weight: 700; }
  .price small { font-size: 11px; font-weight: 400; color: #999; }
  .stock { font-size: 11px; color: #999; }
  .btn {
    border: none; border-radius: 14px; padding: 6px 14px; font-size: 12.5px;
    background: #07c160; color: #fff;
  }
  /* 表单 */
  .panel { display: none; padding: 12px; }
  .panel.on { display: block; }
  .form-box { background: #fff; border-radius: 10px; padding: 14px; }
  .form-box h3 { font-size: 15px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12.5px; color: #666; display: block; margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid #e2e2e2; border-radius: 8px;
    padding: 9px 10px; font-size: 14px; outline: none; background: #fafafa;
  }
  .field textarea { height: 68px; resize: none; }
  .submit { width: 100%; padding: 11px; border: none; border-radius: 22px;
    background: #07c160; color: #fff; font-size: 15px; margin-top: 4px; }
  .tip { font-size: 11.5px; color: #999; text-align: center; margin-top: 10px; line-height: 1.6; }
  /* 记录 */
  .rec { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .rec h4 { font-size: 13.5px; margin-bottom: 4px; }
  .rec p { font-size: 12px; color: #777; line-height: 1.7; }
  .rec .tag { display: inline-block; font-size: 11px; color: #07c160;
    border: 1px solid #07c160; border-radius: 10px; padding: 1px 8px; margin-left: 6px; }
  /* 统计 */
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; background: #fff; border-radius: 10px; padding: 16px 8px; text-align: center; }
  .stat b { display: block; font-size: 22px; color: #07c160; margin-bottom: 4px; }
  .stat span { font-size: 12px; color: #888; }
  /* 底部 tab */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px; height: 56px; background: #fff;
    border-top: 1px solid #eee; display: flex;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; font-size: 11px; color: #999;
  }
  .tab i { font-style: normal; font-size: 18px; }
  .tab.on { color: #07c160; }
  /* 提示 */
  .toast {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.75); color: #fff; padding: 10px 18px;
    border-radius: 8px; font-size: 13.5px; opacity: 0; transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .empty { text-align: center; color: #aaa; font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>

<div class="topbar">
  <h1>启德建材</h1>
  <p>瓷砖 · 卫浴 · 地板 · 门窗 · 一站式采购</p>
</div>

<!-- 商品页 -->
<div class="panel on" id="panel-goods">
  <div class="cats" id="cats"></div>
  <div class="list" id="goods"></div>
  <p class="tip">价格随行就市，最终以报价单为准<br>点“询价”留下电话，销售 10 分钟内联系你</p>
</div>

<!-- 询价页 -->
<div class="panel" id="panel-inquiry">
  <div class="form-box">
    <h3>留下需求，给你出报价单</h3>
    <div class="field">
      <label>称呼 *</label>
      <input id="f-name" placeholder="怎么称呼您，如：王先生">
    </div>
    <div class="field">
      <label>手机号 *</label>
      <input id="f-phone" type="tel" maxlength="11" placeholder="11 位手机号">
    </div>
    <div class="field">
      <label>想买什么</label>
      <select id="f-product"></select>
    </div>
    <div class="field">
      <label>备注（面积、工期、预算）</label>
      <textarea id="f-remark" placeholder="例如：三居室装修，瓷砖约 120 平，下周进场"></textarea>
    </div>
    <button class="submit" onclick="submitInquiry()">提交，等销售联系我</button>
    <p class="tip">提交后信息只用于本店报价，不会外发</p>
  </div>
</div>

<!-- 记录页 -->
<div class="panel" id="panel-record">
  <div id="records"></div>
  <p class="tip">销售后台视图：最近 50 条询价（演示用）</p>
</div>

<!-- 数据页 -->
<div class="panel" id="panel-data">
  <div class="stats">
    <div class="stat"><b id="s-products">-</b><span>在售商品</span></div>
    <div class="stat"><b id="s-today">-</b><span>今日询价</span></div>
    <div class="stat"><b id="s-total">-</b><span>累计询价</span></div>
  </div>
  <p class="tip">数据来自后台统计接口 /api/stats<br>销售每天看这个决定跟谁</p>
</div>

<div class="tabbar">
  <div class="tab on" data-panel="goods" onclick="switchTab(this, 'goods')"><i>🏠</i>商品</div>
  <div class="tab" data-panel="inquiry" onclick="switchTab(this, 'inquiry')"><i>💬</i>询价</div>
  <div class="tab" data-panel="record" onclick="switchTab(this, 'record')"><i>📋</i>记录</div>
  <div class="tab" data-panel="data" onclick="switchTab(this, 'data')"><i>📊</i>数据</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CAT_ICON = { "瓷砖": "🧱", "卫浴": "🚿", "地板": "🪵", "板材": "🪚", "门窗": "🚪" };
  let products = [];
  let curCat = "";

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1600);
  }

  async function loadProducts() {
    const res = await fetch("/api/products" + (curCat ? "?cat=" + encodeURIComponent(curCat) : ""));
    products = await res.json();
    const box = document.getElementById("goods");
    if (!products.length) {
      box.innerHTML = '<div class="empty">这个分类暂无商品</div>';
      return;
    }
    box.innerHTML = products.map(p => `
      <div class="card">
        <div class="thumb">${CAT_ICON[p.cat] || "📦"}</div>
        <div class="info">
          <h3>${p.name}</h3>
          <div class="spec">${p.spec}　剩余 ${p.stock}${p.unit}</div>
          <div class="row">
            <div class="price">¥${p.price}<small> /${p.unit}</small></div>
            <button class="btn" onclick="askFor(${p.id})">询价</button>
          </div>
        </div>
      </div>`).join("");
  }

  async function loadCats() {
    const res = await fetch("/api/products");
    const all = await res.json();
    const cats = [...new Set(all.map(p => p.cat))];
    document.getElementById("cats").innerHTML =
      `<div class="cat ${curCat === "" ? "on" : ""}" onclick="pickCat(this, '')">全部</div>` +
      cats.map(c => `<div class="cat ${curCat === c ? "on" : ""}" onclick="pickCat(this, '${c}')">${c}</div>`).join("");
    document.getElementById("f-product").innerHTML =
      `<option value="">请选择</option>` + all.map(p => `<option value="${p.name}">${p.name}（¥${p.price}/${p.unit}）</option>`).join("");
  }

  function pickCat(el, cat) {
    curCat = cat;
    document.querySelectorAll("#cats .cat").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    loadProducts();
  }

  function askFor(id) {
    const p = products.find(x => x.id === id);
    switchTab(document.querySelector('[data-panel="inquiry"]'), "inquiry");
    document.getElementById("f-product").value = p ? p.name : "";
  }

  async function submitInquiry() {
    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const product = document.getElementById("f-product").value;
    const remark = document.getElementById("f-remark").value.trim();
    if (!name) return toast("请填写称呼");
    if (!/^1\d{10}$/.test(phone)) return toast("手机号格式不对");
    const res = await fetch("/api/inquiry", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, phone, product, remark })
    });
    const data = await res.json();
    if (data.ok) {
      toast("提交成功，销售马上联系您");
      document.getElementById("f-name").value = "";
      document.getElementById("f-phone").value = "";
      document.getElementById("f-remark").value = "";
      loadRecords();
      loadStats();
    } else {
      toast("提交失败，请重试");
    }
  }

  async function loadRecords() {
    const res = await fetch("/api/inquiries");
    const list = await res.json();
    const box = document.getElementById("records");
    if (!list.length) {
      box.innerHTML = '<div class="empty">还没有询价记录</div>';
      return;
    }
    box.innerHTML = list.map(r => `
      <div class="rec">
        <h4>${r.name}　${r.phone}<span class="tag">${r.product || "未指定商品"}</span></h4>
        <p>${r.remark || "无备注"}<br>${r.time}</p>
      </div>`).join("");
  }

  async function loadStats() {
    const res = await fetch("/api/stats");
    const s = await res.json();
    document.getElementById("s-products").textContent = s.products;
    document.getElementById("s-today").textContent = s.todayInquiry;
    document.getElementById("s-total").textContent = s.totalInquiry;
  }

  function switchTab(el, name) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
    el.classList.add("on");
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("on"));
    document.getElementById("panel-" + name).classList.add("on");
    if (name === "record") loadRecords();
    if (name === "data") loadStats();
  }

  loadCats();
  loadProducts();
  loadStats();
</script>
</body>
</html>
