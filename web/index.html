<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>启德建材 · 微信销售小系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f3f5; color: #222;
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 74px;
  }
  /* 顶部 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(135deg, #07c160, #05a850);
    color: #fff; padding: 12px 14px 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .logo {
    width: 38px; height: 38px; border-radius: 8px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    color: #07c160; font-weight: 800; font-size: 15px;
  }
  .brand h1 { font-size: 16px; font-weight: 600; }
  .brand p { font-size: 11px; opacity: .9; margin-top: 2px; }
  .search {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.92); border-radius: 18px; padding: 7px 12px;
  }
  .search input { flex: 1; border: none; outline: none; background: transparent; font-size: 13.5px; }
  .search span { font-size: 13px; color: #07c160; font-weight: 600; }
  /* 分类 */
  .cats {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px;
    background: #fff; border-bottom: 1px solid #eee; scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat { flex: 0 0 auto; padding: 6px 14px; border-radius: 16px; background: #f2f2f2; color: #555; font-size: 13px; }
  .cat.on { background: #07c160; color: #fff; }
  /* 商品卡 */
  .list { padding: 10px 12px 4px; }
  .card {
    display: flex; gap: 10px; background: #fff; border-radius: 12px;
    padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .thumb {
    width: 66px; height: 66px; border-radius: 10px; flex: 0 0 66px;
    background: #eef7f0; display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .info { flex: 1; min-width: 0; }
  .info h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
  .spec { font-size: 11.5px; color: #8a8a8a; margin-bottom: 5px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .price { color: #e64340; font-size: 16.5px; font-weight: 700; }
  .price small { font-size: 11px; font-weight: 400; color: #999; }
  .stock { font-size: 11px; color: #aaa; }
  .add {
    border: none; border-radius: 15px; padding: 6px 14px; font-size: 12.5px;
    background: #07c160; color: #fff;
  }
  .add.gray { background: #f0f0f0; color: #666; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid #07c160;
    background: #fff; color: #07c160; font-size: 15px; line-height: 1;
  }
  .stepper span { font-size: 14px; min-width: 16px; text-align: center; }
  /* 购物车浮条 */
  .cartbar {
    position: fixed; bottom: 58px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 396px; margin: 0 12px;
    background: #1f2329; color: #fff; border-radius: 26px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.2); z-index: 30;
  }
  .cartbar .sum { font-size: 13px; }
  .cartbar .sum b { color: #ffd04b; font-size: 17px; margin-left: 2px; }
  .cartbar .go { background: #07c160; border: none; color: #fff; border-radius: 18px; padding: 8px 16px; font-size: 13px; }
  /* 面板 */
  .panel { display: none; padding: 12px; }
  .panel.on { display: block; }
  .form-box { background: #fff; border-radius: 12px; padding: 14px; }
  .form-box h3 { font-size: 15px; margin-bottom: 10px; }
  .field { margin-bottom: 11px; }
  .field label { font-size: 12.5px; color: #666; display: block; margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid #e3e3e3; border-radius: 9px;
    padding: 9px 10px; font-size: 14px; outline: none; background: #fafafa;
  }
  .field textarea { height: 64px; resize: none; }
  .submit { width: 100%; padding: 11px; border: none; border-radius: 22px; background: #07c160; color: #fff; font-size: 15px; }
  .tip { font-size: 11.5px; color: #999; text-align: center; margin-top: 10px; line-height: 1.6; }
  /* 记录 */
  .filter { display: flex; gap: 8px; margin-bottom: 10px; }
  .filter div { flex: 1; text-align: center; font-size: 12.5px; padding: 7px 0; border-radius: 16px; background: #fff; color: #666; }
  .filter div.on { background: #07c160; color: #fff; }
  .rec { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .rec h4 { font-size: 13.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rec .st { font-size: 10.5px; padding: 1px 7px; border-radius: 9px; }
  .st.wait { background: #fff3e0; color: #ef6c00; }
  .st.done { background: #e3f2fd; color: #1565c0; }
  .st.deal { background: #e8f5e9; color: #2e7d32; }
  .rec p { font-size: 12px; color: #777; line-height: 1.7; }
  .rec .acts { margin-top: 8px; display: flex; gap: 8px; }
  .rec .acts button { flex: 1; font-size: 12px; padding: 6px 0; border-radius: 14px; border: 1px solid #ddd; background: #fff; color: #555; }
  .rec .acts button.on { border-color: #07c160; color: #07c160; }
  /* 数据 */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: #fff; border-radius: 12px; padding: 14px 10px; text-align: center; }
  .stat b { display: block; font-size: 21px; color: #07c160; margin-bottom: 3px; }
  .stat span { font-size: 11.5px; color: #888; }
  .topbox { background: #fff; border-radius: 12px; padding: 14px; margin-top: 10px; }
  .topbox h4 { font-size: 13.5px; margin-bottom: 8px; }
  .topbox .t { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; color: #555; }
  .topbox .t:last-child { border-bottom: none; }
  /* 底部 tab */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px; height: 56px; background: #fff;
    border-top: 1px solid #eee; display: flex; z-index: 40;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: #999; }
  .tab i { font-style: normal; font-size: 17px; }
  .tab.on { color: #07c160; }
  /* 弹层 */
  .mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
    align-items: flex-end; justify-content: center;
  }
  .mask.on { display: flex; }
  .sheet {
    width: 100%; max-width: 420px; background: #fff; border-radius: 16px 16px 0 0;
    padding: 16px 16px 22px; max-height: 78vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 16px; margin-bottom: 12px; text-align: center; }
  .qitem { display: flex; justify-content: space-between; font-size: 12.5px; color: #444; padding: 5px 0; }
  .qtotal { display: flex; justify-content: space-between; font-size: 14px; padding: 10px 0 4px; border-top: 1px dashed #eee; margin-top: 6px; }
  .qtotal b { color: #e64340; font-size: 17px; }
  .sheet .close { width: 100%; margin-top: 10px; background: #f4f4f4; border: none; border-radius: 20px; padding: 10px; font-size: 14px; color: #666; }
  .toast {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.78); color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13.5px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60;
  }
  .toast.show { opacity: 1; }
  .empty { text-align: center; color: #aaa; font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">启德</div>
    <div>
      <h1>启德建材 · 一站式采购</h1>
      <p>瓷砖 · 卫浴 · 地板 · 板材 · 门窗</p>
    </div>
  </div>
  <div class="search">
    <input id="kw" placeholder="搜瓷砖、地板、马桶…" onkeydown="if(event.key==='Enter')doSearch()">
    <span onclick="doSearch()">搜索</span>
  </div>
</div>

<!-- 商品 -->
<div class="panel on" id="panel-goods">
  <div class="cats" id="cats"></div>
  <div class="list" id="goods"></div>
  <p class="tip">价格随行就市，最终以报价单为准<br>加购后点底部购物车，一次性出报价单</p>
</div>

<!-- 记录 -->
<div class="panel" id="panel-record">
  <div class="filter">
    <div class="on" onclick="setFilter(this,'')">全部</div>
    <div onclick="setFilter(this,'待联系')">待联系</div>
    <div onclick="setFilter(this,'已联系')">已联系</div>
    <div onclick="setFilter(this,'已成交')">已成交</div>
  </div>
  <div id="records"></div>
  <p class="tip">销售后台：点状态按钮更新跟进进度</p>
</div>

<!-- 数据 -->
<div class="panel" id="panel-data">
  <div class="stats">
    <div class="stat"><b id="s-products">-</b><span>在售商品</span></div>
    <div class="stat"><b id="s-today">-</b><span>今日询价</span></div>
    <div class="stat"><b id="s-total">-</b><span>累计询价</span></div>
    <div class="stat"><b id="s-pending">-</b><span>待跟进</span></div>
  </div>
  <div class="topbox">
    <h4>咨询最多的商品 Top3</h4>
    <div id="toplist"></div>
  </div>
  <p class="tip">数据来自 /api/stats · 每天看一眼就知道备什么货</p>
</div>

<!-- 购物车浮条 -->
<div class="cartbar" id="cartbar" style="display:none">
  <div class="sum">已选 <span id="cartCount">0</span> 项，合计 <b id="cartSum">¥0</b></div>
  <button class="go" onclick="openQuote()">出报价单</button>
</div>

<!-- 报价单弹层 -->
<div class="mask" id="quoteMask">
  <div class="sheet">
    <h3>报价单</h3>
    <div id="quoteItems"></div>
    <div class="qtotal"><span>合计</span><b id="quoteTotal">¥0</b></div>
    <div class="field" style="margin-top:12px">
      <label>称呼 *</label>
      <input id="f-name" placeholder="怎么称呼您，如：王先生">
    </div>
    <div class="field">
      <label>手机号 *</label>
      <input id="f-phone" type="tel" maxlength="11" placeholder="11 位手机号">
    </div>
    <div class="field">
      <label>备注（面积、工期、预算）</label>
      <textarea id="f-remark" placeholder="例如：三居室装修，瓷砖约 120 平，下周进场"></textarea>
    </div>
    <button class="submit" onclick="submitInquiry()">提交询价，等销售联系我</button>
    <button class="close" onclick="closeQuote()">再逛逛</button>
  </div>
</div>

<div class="tabbar">
  <div class="tab on" data-panel="goods" onclick="switchTab(this,'goods')"><i>🏠</i>商品</div>
  <div class="tab" data-panel="record" onclick="switchTab(this,'record')"><i>📋</i>记录</div>
  <div class="tab" data-panel="data" onclick="switchTab(this,'data')"><i>📊</i>数据</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const ICON = { "瓷砖": "🧱", "卫浴": "🚿", "地板": "🪵", "板材": "🪚", "门窗": "🚪" };
  let products = [], curCat = "", kw = "", filter = "", allProducts = [];
  let cart = {};          // {productId: {p, qty}}

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1700);
  }
  function money(n) { return "¥" + (Math.round(n * 100) / 100).toLocaleString(); }

  async function loadAll() {
    allProducts = await (await fetch("/api/products")).json();
    const cats = [...new Set(allProducts.map(p => p.cat))];
    document.getElementById("cats").innerHTML =
      `<div class="cat ${curCat === "" ? "on" : ""}" onclick="pickCat(this,'')">全部</div>` +
      cats.map(c => `<div class="cat ${curCat === c ? "on" : ""}" onclick="pickCat(this,'${c}')">${c}</div>`).join("");
    await loadProducts();
  }

  async function loadProducts() {
    const qs = [];
    if (curCat) qs.push("cat=" + encodeURIComponent(curCat));
    if (kw) qs.push("kw=" + encodeURIComponent(kw));
    products = await (await fetch("/api/products" + (qs.length ? "?" + qs.join("&") : ""))).json();
    const box = document.getElementById("goods");
    if (!products.length) {
      box.innerHTML = '<div class="empty">没有找到相关商品</div>';
      return;
    }
    box.innerHTML = products.map(p => {
      const inCart = cart[p.id] ? cart[p.id].qty : 0;
      return `<div class="card">
        <div class="thumb">${ICON[p.cat] || "📦"}</div>
        <div class="info">
          <h3>${p.name}</h3>
          <div class="spec">${p.spec}　库存 ${p.stock}${p.unit}</div>
          <div class="row">
            <div class="price">${money(p.price)}<small> /${p.unit}</small></div>
            ${inCart
              ? `<div class="stepper">
                   <button onclick="dec(${p.id})">−</button><span>${inCart}</span>
                   <button onclick="inc(${p.id})">+</button>
                 </div>`
              : `<button class="add" onclick="inc(${p.id})">加入报价</button>`}
          </div>
        </div>
      </div>`;
    }).join("");
    // 库存显示
    products.forEach(p => {});
  }

  function pickCat(el, c) {
    curCat = c;
    document.querySelectorAll("#cats .cat").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    loadProducts();
  }

  function doSearch() {
    kw = document.getElementById("kw").value.trim();
    loadProducts();
  }

  function inc(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    if (!cart[id]) cart[id] = { p, qty: 0 };
    if (cart[id].qty >= p.stock) return toast("库存不足");
    cart[id].qty++;
    refreshCart();
    loadProducts();
  }

  function dec(id) {
    if (!cart[id]) return;
    cart[id].qty--;
    if (cart[id].qty <= 0) delete cart[id];
    refreshCart();
    loadProducts();
  }

  function refreshCart() {
    const items = Object.values(cart);
    const count = items.reduce((s, x) => s + x.qty, 0);
    const sum = items.reduce((s, x) => s + x.qty * x.p.price, 0);
    document.getElementById("cartCount").textContent = count;
    document.getElementById("cartSum").textContent = money(sum);
    document.getElementById("cartbar").style.display = count ? "flex" : "none";
  }

  function openQuote() {
    const items = Object.values(cart);
    if (!items.length) return toast("先加购商品");
    document.getElementById("quoteItems").innerHTML = items.map(x =>
      `<div class="qitem"><span>${x.p.name} × ${x.qty}${x.p.unit}</span>
       <span>${money(x.p.price * x.qty)}</span></div>`).join("");
    document.getElementById("quoteTotal").textContent =
      money(items.reduce((s, x) => s + x.p.price * x.qty, 0));
    document.getElementById("quoteMask").classList.add("on");
  }

  function closeQuote() {
    document.getElementById("quoteMask").classList.remove("on");
  }

  async function submitInquiry() {
    const items = Object.values(cart);
    if (!items.length) return toast("购物车是空的");
    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const remark = document.getElementById("f-remark").value.trim();
    if (!name) return toast("请填写称呼");
    if (!/^1\d{10}$/.test(phone)) return toast("手机号格式不对");

    const productNames = items.map(x => `${x.p.name}×${x.qty}`).join("，");
    const amount = items.reduce((s, x) => s + x.p.price * x.qty, 0);
    const res = await fetch("/api/inquiry", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, phone, product: productNames, remark, amount })
    });
    const data = await res.json();
    if (data.ok) {
      toast("提交成功，销售马上联系您");
      cart = {}; refreshCart(); loadProducts();
      document.getElementById("f-name").value = "";
      document.getElementById("f-phone").value = "";
      document.getElementById("f-remark").value = "";
      closeQuote();
      loadStats();
    } else {
      toast("提交失败，请重试");
    }
  }

  function setFilter(el, s) {
    filter = s;
    document.querySelectorAll(".filter div").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    loadRecords();
  }

  async function loadRecords() {
    const list = await (await fetch("/api/inquiry" + (filter ? "?status=" + encodeURIComponent(filter) : ""))).json();
    const box = document.getElementById("records");
    if (!list.length) { box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
    box.innerHTML = list.map(r => {
      const cls = r.status === "已成交" ? "deal" : (r.status === "已联系" ? "done" : "wait");
      return `<div class="rec">
        <h4>${r.name}　${r.phone}<span class="st ${cls}">${r.status}</span></h4>
        <p>意向：${r.product || "未指定"}${r.amount ? " · 报价 " + money(r.amount) : ""}<br>备注：${r.remark || "无"}<br>${r.time}</p>
        <div class="acts">
          <button class="${r.status === '待联系' ? 'on' : ''}" onclick="setStatus(${r.id},'待联系')">待联系</button>
          <button class="${r.status === '已联系' ? 'on' : ''}" onclick="setStatus(${r.id},'已联系')">已联系</button>
          <button class="${r.status === '已成交' ? 'on' : ''}" onclick="setStatus(${r.id},'已成交')">已成交</button>
        </div>
      </div>`;
    }).join("");
  }

  async function setStatus(id, status) {
    const res = await fetch("/api/inquiry/status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status })
    });
    const data = await res.json();
    if (data.ok) { toast("已更新为：" + status); loadRecords(); loadStats(); }
  }

  async function loadStats() {
    const s = await (await fetch("/api/stats")).json();
    document.getElementById("s-products").textContent = s.products;
    document.getElementById("s-today").textContent = s.todayInquiry;
    document.getElementById("s-total").textContent = s.totalInquiry;
    document.getElementById("s-pending").textContent = s.pending;
    document.getElementById("toplist").innerHTML = (s.top && s.top.length)
      ? s.top.map((t, i) => `<div class="t"><span>${i + 1}. ${t.name}</span><span>${t.count} 次</span></div>`).join("")
      : '<div class="t" style="color:#aaa">暂无询价数据</div>';
  }

  function switchTab(el, name) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
    el.classList.add("on");
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("on"));
    document.getElementById("panel-" + name).classList.add("on");
    if (name === "record") loadRecords();
    if (name === "data") loadStats();
  }

  loadAll();
  loadStats();
</script>
</body>
</html>
